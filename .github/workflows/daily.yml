name: daily

on:
  schedule:
    - cron: "17 22 * * *"   # 22:17 UTC = 06:17 Beijing
  workflow_dispatch:

permissions:
  contents: write

env:
  MAIL_USER: ${{ secrets.MAIL_USER || secrets.GMAIL_USER }}
  MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD || secrets.GMAIL_APP_PASSWORD }}
  MAIL_TO: ${{ secrets.MAIL_TO }}
  SMTP_HOST: ${{ secrets.SMTP_HOST }}   # e.g. smtp.163.com; empty = smtp.gmail.com
  SMTP_PORT: ${{ secrets.SMTP_PORT }}   # empty = 465
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # empty = no briefing
  BRIEF_MODEL: ${{ secrets.BRIEF_MODEL }}               # empty = claude-opus-5-5

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: newscollector run
      - run: newscollector brief
      - name: Commit digest, brief and database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.db digests/ briefs/
          git diff --cached --quiet || git commit -m "digest $(date -u +%F)"
          git push
      - name: Email digest
        if: env.MAIL_PASSWORD != ''
        run: |
          export DIGEST_URL="${{ github.server_url }}/${{ github.repository }}/blob/main/digests/$(date -u +%F).md"
          newscollector email
