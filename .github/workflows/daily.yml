name: daily

on:
  schedule:
    - cron: "17 22 * * *"   # 22:17 UTC = 06:17 Beijing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: newscollector run
      - name: Commit digest and database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.db digests/
          git diff --cached --quiet || git commit -m "digest $(date -u +%F)"
          git push
