name: daily

# Manual backup only. The morning run is done by the scheduled Claude session (see BRIEFING.md):
# GitHub's cron was hours late, which left the 06:45 briefing with no data.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: newscollector run
      - name: Commit digest and database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.db digests/
          git diff --cached --quiet || git commit -m "digest $(TZ=Asia/Shanghai date +%F)"
          git push
