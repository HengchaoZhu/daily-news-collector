[project]
name = "newscollector"
version = "0.1.0"
description = "Daily news collector: RSS/Atom + Google News search feeds -> SQLite -> Markdown digest"
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0",
    "PyYAML>=6.0",
    "requests>=2.31",
    "anthropic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
newscollector = "newscollector.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["newscollector*"]
